<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>EVENT-UALLY DONE - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">EVENT-UALLY DONE</h3>
                    <h5 class="mb-3 text-center">Sign In</h5>
                    
                    <!-- Diagnostic Alert Box -->
                    <div id="authMsg"></div>

                    <!-- Plain div container -->
                    <div class="mt-3">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input class="form-control" id="emailInput" type="email" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control" id="passwordInput" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100 mb-3" id="loginBtn" type="button">Login</button>
                    </div>

                    <div class="text-center small">
                        Don't have an account? <a href="/register.html">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- External script file to satisfy Helmet's CSP rule -->
<script src="/js/login.js"></script>
</body>
</html>
